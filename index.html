<script>
  // ======================
  // DARK / LIGHT MODE TOGGLE + SYSTEM PREFERENCE
  // ======================
  const themeToggle = document.getElementById('themeToggle');
  const body = document.body;

  // Function to apply theme
  function applyTheme(theme) {
    if (theme === 'light') {
      body.classList.add('light');
      themeToggle.textContent = '☀️';
    } else {
      body.classList.remove('light');
      themeToggle.textContent = '🌙';
    }
  }

  // 1. Check localStorage first
  const savedTheme = localStorage.getItem('theme');

  if (savedTheme) {
    // User already chose before
    applyTheme(savedTheme);
  } else {
    // No saved preference → follow system setting
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    applyTheme(prefersDark ? 'dark' : 'light');
  }

  // 2. Toggle when button is clicked
  themeToggle.addEventListener('click', () => {
    const isLight = body.classList.toggle('light');
    const newTheme = isLight ? 'light' : 'dark';

    themeToggle.textContent = isLight ? '☀️' : '🌙';
    localStorage.setItem('theme', newTheme);
  });

  // 3. Optional: Listen if user changes system theme while page is open
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
    // Only auto-change if user has never manually chosen a theme
    if (!localStorage.getItem('theme')) {
      applyTheme(e.matches ? 'dark' : 'light');
    }
  });

  // ======================
  // DUE DATE
  // ======================
  function updateDueDate() {
    const now = new Date();
    let month = now.getMonth();
    let day = now.getDate();

    if (day > 29) {
      month += 1;
      if (month > 11) month = 0;
    }

    const monthNames = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
    document.getElementById("dueMonth").textContent = monthNames[month];
    document.getElementById("dueDay").textContent = "29";
  }
  updateDueDate();
</script>
